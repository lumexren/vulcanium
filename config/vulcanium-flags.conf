# Default Vulcanium runtime flags
# Copy to ~/.config/vulcanium-flags.conf to override per-user.

--ozone-platform-hint=auto
--use-gl=angle
--use-angle=vulkan
--enable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE,VulkanVideoDecode
--enable-unsafe-webgpu
--ignore-gpu-blocklist
--enable-gpu-rasterization
