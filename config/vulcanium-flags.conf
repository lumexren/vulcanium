# Default Vulcanium runtime flags
# Copy to ~/.config/vulcanium-flags.conf or /etc/vulcanium/default-flags.conf

--ozone-platform-hint=auto
--use-gl=angle
--use-angle=vulkan
--enable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE,VaapiVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
