# Default Vulcanium runtime flags
# Copy to ~/.config/vulcanium-flags.conf to override per-user.

--ozone-platform-hint=auto
--in-process-gpu
--use-gl=angle
--use-angle=vulkan
--enable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE,VulkanVideoDecode,VulkanVideoEncode
--enable-unsafe-webgpu
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-gpu-memory-buffer-video-frames
--enable-native-gpu-memory-buffers
